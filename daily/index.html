<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{color-scheme:light;--page:#f9f9f7;--surf:#fcfcfb;--card:#fff;--ink:#0b0b0b;--ink2:#52514e;--mut:#898781;--grid:#e1e0d9;--base:#c3c2b7;--line:rgba(11,11,11,.10);--acc:#2a78d6;--accSoft:#e6f0fc;--bad:#d03b3b;

*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--ink);padding-bottom:76px;-webkit-tap-highlight-color:transparent}

.atile{display:flex;flex-direction:column;gap:4px;min-width:0}.atile .chb{flex:1}.run{font-size:12px;padding:3px 4px;color:var(--ink2)}.run.on{background:var(--acc);color:#fff;border-color:transparent}
.ver{font-size:11px;font-weight:400;color:var(--mut);margin-left:4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}

.nt{text-transform:none;letter-spacing:0;font-weight:400}
button{-webkit-user-select:none;user-select:none;touch-action:manipulation}.crow{-webkit-user-select:none;user-select:none}
button,.btn{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:center;text-decoration:none;display:inline-block}
button:disabled{opacity:.3}
.pri{background:var(--acc)!important;color:#fff!important;border-color:transparent!important;font-weight:600}
.sel{background:var(--accSoft);border-color:var(--acc)}
button.sm{font-size:12px;padding:3px 10px;text-transform:none;letter-spacing:0;font-weight:500}

textarea{resize:vertical}
.mut{color:var(--mut)}p.sm{font-size:12px;margin-top:6px}

.badge{position:absolute;top:3px;left:calc(50% + 7px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;min-width:16px}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:10px}

.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;flex:0 0 10px}
.sw.s0{background:var(--c0)}.sw.s1{background:var(--c1)}.sw.s2{background:var(--c2)}.sw.s3{background:var(--c3)}.sw.s4{background:var(--c4)}.sw.s5{background:var(--c5)}.sw.s6{background:var(--c6)}
.cnt{display:flex;align-items:center;gap:8px;padding:6px 0}.cnt+.cnt{border-top:1px solid var(--line)}

.plus{font-size:20px;padding:9px 22px;border-radius:12px}
.tm{display:flex;align-items:center;gap:6px}.tm input{width:auto;padding:3px 6px;margin:0}

.hm{display:flex;align-items:center;gap:6px}.hm input{width:64px;padding:6px 8px}

.inb .txt{cursor:default}
.rng{margin-bottom:10px}.rng button{font-size:14px}

.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px}
.tv{font-size:21px;font-weight:650;line-height:1.2}.tl{font-size:11px;color:var(--ink2)}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin:-2px 0 6px}
.chart{position:relative;min-height:150px}.chart svg{display:block;touch-action:pan-y}
.chart .b{fill:var(--acc)}.chart .gr{stroke:var(--grid)}.chart .bl{stroke:var(--base)}
.chart .ax{fill:var(--mut);font-size:10px;font-variant-numeric:tabular-nums}.chart .hl{fill:var(--ink);opacity:.06}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.s0{stroke:var(--c0)}.chart .ln.s1{stroke:var(--c1)}.chart .ln.s2{stroke:var(--c2)}.chart .ln.s3{stroke:var(--c3)}.chart .ln.s4{stroke:var(--c4)}.chart .ln.s5{stroke:var(--c5)}.chart .ln.s6{stroke:var(--c6)}
.chart .dt{stroke:var(--card);stroke-width:2}.chart .dt.s0{fill:var(--c0)}.chart .dt.s1{fill:var(--c1)}.chart .dt.s2{fill:var(--c2)}.chart .dt.s3{fill:var(--c3)}.chart .dt.s4{fill:var(--c4)}.chart .dt.s5{fill:var(--c5)}.chart .dt.s6{fill:var(--c6)}
.chart .xh{stroke:var(--base)}.chart .dl{fill:var(--ink2);font-size:10px;font-weight:600}
.tip{position:absolute;top:-4px;background:var(--ink);color:var(--card);font-size:12px;padding:4px 8px;border-radius:6px;pointer-events:none;white-space:nowrap}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb td,.tb th{padding:5px 4px;border-top:1px solid var(--line);text-align:left;font-weight:normal;white-space:nowrap}
.tb th{color:var(--mut);font-size:12px;border-top:0}.tb .num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.sh{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sh h3{font-size:16px;margin-bottom:8px}.sh p{font-size:14px;margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.danger{color:var(--bad)}
#expOut textarea{margin-top:8px;font-size:12px}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--card);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.hl{display:grid;grid-template-columns:92px 1fr;gap:6px;font-size:13px;padding:4px 0;border-top:1px solid var(--line)}.hl>span{color:var(--ink2)}.hl>div{white-space:pre-wrap;word-break:break-word}.hday .sm{margin-top:6px}
.nc{padding:10px 12px}.nh{display:flex;align-items:center;gap:6px;margin-bottom:4px}.nh .x{font-size:16px;padding:0 5px}
.ncat{font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.note{white-space:pre-wrap;word-break:break-word;font-size:14px}.note.clp{max-height:8.6em;overflow:hidden}
.note pre{white-space:pre;overflow-x:auto;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;margin:4px 0}
.note code{font-size:12px;background:var(--surf);border-radius:4px;padding:0 3px}.note a,.txt a,.hl a{color:var(--acc);word-break:break-all}.mh{font-size:15px}.more{margin-top:4px}
.crow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.ct{display:flex;flex-direction:column;align-items:center;gap:0;padding:5px 2px 6px;border-radius:10px;background:var(--surf);border:1px solid var(--line);min-width:0}
.ct b{font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.pm{display:flex;gap:4px;margin-top:3px}.pm button{width:28px;padding:1px 0;font-size:17px;font-weight:700;line-height:1.3;border-radius:7px}
.cl{font-size:13px;font-weight:650;display:flex;align-items:center}.cm{font-size:11px;color:var(--mut);white-space:nowrap}
.cp{margin-top:5px;font-size:13px;font-weight:700;color:#fff;background:var(--acc);border-radius:8px;padding:2px 10px}
.crow~.chips{margin-top:10px}
.sy{border:0;font-size:15px;padding:4px 8px;color:var(--mut)}.sy.ok{color:#0ca30c}.sy.pend{color:#c98500}.sy.err{color:var(--bad)}
.add input:not([type=date]){flex:1;min-width:0}
.dts{margin-bottom:8px}.dts button{font-size:14px;padding:7px 0}.md{margin-bottom:10px}.md button{font-size:13px;padding:5px 0}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.chb{display:flex;flex-direction:column;align-items:center;padding:7px 4px;font-size:13px;line-height:1.25}.chb span{font-size:11px;color:var(--ink2);min-height:14px}
.tiles.t5{grid-template-columns:repeat(5,1fr)}.t5 .tile{padding:8px 6px}.t5 .tv{font-size:18px}.t5 .tl{white-space:nowrap}
.mini{display:flex;align-items:flex-start;gap:4px}.mini .ml{flex:0 0 36px;font-size:12px;font-weight:600;padding-top:2px;display:flex;align-items:center}.mini .chart{flex:1}
.chart.auto{min-height:0}
.chart .b.s0{fill:var(--c0)}.chart .b.s1{fill:var(--c1)}.chart .b.s2{fill:var(--c2)}.chart .b.s3{fill:var(--c3)}.chart .b.s4{fill:var(--c4)}
.chart .hc{fill:var(--acc)}.chart .hc.z{fill:var(--grid)}.chart .hx{fill:none;stroke:var(--ink);stroke-width:1.5}
.brk{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13px;margin-top:10px}.brk i{display:block;height:8px;border-radius:0 4px 4px 0;background:var(--acc)}.brk .num{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header><h1>Daily <small class="ver">v1.9</small></h1><span><button id="upd" class="sm runh" data-a="reload" hidden>↻ nova verzija</button><button id="runH" class="sm runh" data-a="gotoRun" hidden></button><button id="sy" class="sy" data-a="syncNow" hidden aria-label="Sinhroniziraj">⟳</button><button class="sm" data-a="settings" aria-label="Nastavitve" style="font-size:18px;border:0">⚙</button></span></header>
<main id="main"></main>
<nav>
<button data-tab="dnevnik"><span class="i">📓</span>Dnevnik</button>
<button data-tab="opravila"><span class="i">✅</span>Opravila<span id="badge" class="badge" hidden></span></button>
<button data-tab="nakupi"><span class="i">🛒</span>Nakupi</button>
<button data-tab="zaznamki"><span class="i">🔖</span>Zaznamki</button>
<button data-tab="pregled"><span class="i">📊</span>Pregled</button>
</nav>
<div id="sheet"><div class="sh" id="sheetIn"></div></div>
<div id="toast"></div>
<script>
'use strict';
// ---------- data (every record: id + u = last-modified ms; deletes are tombstones -> merge-ready for later sync)
const COLS=['log','smokes','todos','shop','inbox','chores','acts','cfg','notes'],KEY='daily.v1',
MOOD=['😫','🙁','😐','🙂','😄'],
HL=[['ok','OK'],['virus','Virus / prehlad'],['glava','Glavobol'],['inj','Poškodba'],['drugo','Drugo']],
BODY=['glava','vrat','rama','nadlaket','komolec','zapestje','dlan / prsti','prsni koš','zgornji hrbet','križ','trebuh','kolk','stegno','koleno','meča / golen','gleženj','stopalo'],
SPORT=[[15,'15'],[30,'30'],[45,'45'],[60,'1 h'],[61,'1 h+']],
DN=['ned','pon','tor','sre','čet','pet','sob'],
CATS=[['g','Živila'],['t','Tehnika'],['s','Šport']],CATN={g:'Živila',t:'Tehnika',s:'Šport'},catOf=r=>r.cat||'g',
MODES=[['chill','Chill','😌'],['normal','Normal','🙂'],['busy','Busy','⚡'],['tense','Tense','😬']],MODEN={chill:'Chill',normal:'Normal',busy:'Busy',tense:'Tense'},
DT=[['f','Prosto','🏖'],['d','DOD','🏠'],['i','IJS','🏢']],DTN={f:'Prosto',d:'DOD',i:'IJS'},
CHORES=['Sesanje','Posoda','Pomivalni stroj','Perilo','Likanje','Kuhanje','Kopalnica','Prah','Smeti','Okolica','Drugo'],
K=['SM','BO','JO','CF','WD'],STEPS=[5,30,-5,-30],
DEFL={chores:['Kuhinja: smeti, sesanje, zajtrk, kosilo, večerja, pult, omare, fronte, generalno','Kopalnica: umivalnik, WC, tuš / kad, ogledalo, tla, generalno','Dnevna soba: sesanje, prah, pospravljanje, generalno','Spalnica: postelja, sesanje, prah, pospravljanje','Perilo: pranje, obešanje, zlaganje, likanje','Zunaj: smeti, okolica','Klet: pospravljanje, drva, sesanje','Podstreha: pospravljanje, sesanje','Avto: servis, pospravljanje, pranje','Popravila: hiša, naprave, kolo, drugo','Ostalo: nakupovanje, drugo'],acts:['Sprehod','Šport','Meditacija','Kitara'],health:['Virus / prehlad','Glavobol'],body:BODY,notecats:['Splošno','Delo','Ideje','Povezave']},
HKEY={'Virus / prehlad':'virus','Glavobol':'glava'},HLAB={ok:'OK',virus:'Virus / prehlad',glava:'Glavobol',inj:'Poškodba',drugo:'Drugo'},OLDK={S:'SM',B:'BO',J:'JO'},kOf=r=>OLDK[r.k]||r.k||'SM';
const mem={},st={get:k=>{try{return localStorage.getItem(k)}catch(e){return k in mem?mem[k]:null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
const empty=()=>{const d={v:1};COLS.forEach(c=>d[c]={});return d};
function load(){let d=null;try{d=JSON.parse(st.get(KEY))}catch(e){}const o=empty();if(d&&typeof d==='object')COLS.forEach(c=>{if(d[c]&&typeof d[c]==='object')o[c]=d[c]});return o}
function merge(a,b){const o=empty();COLS.forEach(c=>{o[c]={...(a[c]||{})};for(const[id,r]of Object.entries(b[c]||{})){const x=o[c][id];if(r&&typeof r==='object'&&(!x||(r.u||0)>(x.u||0)))o[c][id]=r}});return o}
// one-time migration of old storage keys (same origin, so data carries over to /daily/); data is merged, not overwritten
try{const L=localStorage,o=L.getItem('pomocnik.v1');if(o!=null){let n=null;try{n=JSON.parse(L.getItem('daily.v1'))}catch(e){}L.setItem('daily.v1',JSON.stringify(merge(n||empty(),JSON.parse(o)||{})));L.removeItem('pomocnik.v1')}
for(const k of['gh','ok']){const v=L.getItem('pomocnik.'+k);if(v!=null){if(L.getItem('daily.'+k)==null||k==='ok')L.setItem('daily.'+k,v);L.removeItem('pomocnik.'+k)}}}catch(e){}
let S=load(),saveT=0;
// merge with what is stored before writing, so two open tabs never overwrite each other
const flush=()=>{clearTimeout(saveT);S=merge(load(),S);st.set(KEY,JSON.stringify(S))};
const save=()=>{clearTimeout(saveT);saveT=setTimeout(flush,300)};
const now=()=>Date.now(),uid=()=>now().toString(36)+Math.random().toString(36).slice(2,7);
function put(c,r){r.u=now();S[c][r.id]=r;save();if(gOK()){SY.dirty=true;schedSync(20000)}return r}
const live=c=>Object.values(S[c]).filter(r=>!r.del);
const count=()=>COLS.reduce((s,c)=>s+live(c).length,0);
// ---------- helpers
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),
dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),
pd=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)},
addD=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return dk(d)},
today=()=>dk(new Date()),
fmtD=k=>{const d=pd(k);return DN[d.getDay()]+', '+d.getDate()+'. '+(d.getMonth()+1)+'.'},
hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())},
fmtMin=m=>Math.floor(m/60)+' h '+pad(Math.round(m%60))+' min',
agoS=ms=>{const m=Math.floor(ms/60000);return m<60?m+' min':Math.floor(m/60)+' h '+m%60+' m'},
fmtM=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':''),

function pearson(p){const n=p.length;if(n<2)return null;let sx=0,sy=0;p.forEach(([x,y])=>{sx+=x;sy+=y});const mx=sx/n,my=sy/n;let a=0,bx=0,by=0;p.forEach(([x,y])=>{a+=(x-mx)*(y-my);bx+=(x-mx)**2;by+=(y-my)**2});return bx&&by?a/Math.sqrt(bx*by):null}

function nice(m,int){if(!(m>0))m=1;const raw=m/4,p=10**Math.floor(Math.log10(raw)),f=raw/p;let s=(f<=1?1:f<=2?2:f<=5?5:10)*p;if(int)s=Math.max(1,s);return{max:Math.ceil(m/s-1e-9)*s,step:s}}
function drawCharts(){CH.forEach(c=>c.type==='line'?drawLines(c):c.type==='heat'?drawHeat(c):drawChart(c))}
// heatmap rows x 24 h; one hue, darker = more (relative within the row)
function drawHeat(c){const el=document.getElementById(c.id);if(!el)return;
const W=Math.max(240,el.clientWidth),pl=30,pr=2,pt=2,rh=18,g=3,pb=18,nr=c.rows.length,H=pt+nr*(rh+g)+pb,cw=(W-pl-pr)/24;
let s=`<svg width="${W}" height="${H}" aria-hidden="true">`;
c.rows.forEach((r,ri)=>{const mx=Math.max(1,...r.vals),y=pt+ri*(rh+g);s+=`<text class="ax" x="${pl-6}" y="${y+rh/2+3.5}" text-anchor="end">${r.k}</text>`;
r.vals.forEach((v,h)=>{s+=`<rect class="hc${v?'':' z'}" x="${(pl+h*cw+1).toFixed(1)}" y="${y}" width="${(cw-2).toFixed(1)}" height="${rh}" rx="2"${v?` fill-opacity="${(.15+.85*v/mx).toFixed(2)}"`:''}/>`})});
for(let h=0;h<24;h+=3)s+=`<text class="ax" x="${pl+(h+.5)*cw}" y="${H-5}" text-anchor="middle">${h}</text>`;
s+=`<rect class="hx" x="0" y="0" width="${cw}" height="${rh}" rx="2" visibility="hidden"/>`;
el.innerHTML=s+'</svg><div class="tip" hidden></div>';const svg=el.firstChild,hx=svg.querySelector('.hx'),tip=el.lastChild;
const hide=()=>{tip.hidden=true;hx.setAttribute('visibility','hidden')};
const mv=e=>{const b=svg.getBoundingClientRect(),h=Math.floor((e.clientX-b.left-pl)/cw),ri=Math.floor((e.clientY-b.top-pt)/(rh+g));if(h<0||h>23||ri<0||ri>=nr)return hide();
const r=c.rows[ri],y=pt+ri*(rh+g);hx.setAttribute('x',pl+h*cw+1);hx.setAttribute('y',y);hx.setAttribute('width',cw-2);hx.setAttribute('visibility','visible');
tip.hidden=false;tip.textContent=c.tip(r.k,h,r.vals[h]);const tw=tip.offsetWidth;tip.style.left=Math.min(Math.max(0,pl+(h+.5)*cw-tw/2),W-tw)+'px';tip.style.top=(y-28)+'px'};
svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hide()})}
function yAxis(sc,Y,pl,W,pr,mini){let s='';const vs=[];if(mini)vs.push(0,sc.max);else for(let v=0;v<=sc.max+1e-9;v+=sc.step)vs.push(v);for(const v of vs){const y=Y(v);if(v>0)s+=`<line class="gr" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/>`;s+=`<text class="ax" x="${pl-5}" y="${y+3.5}" text-anchor="end">${String(+v.toFixed(1)).replace('.',',')}</text>`}return s}

// ---------- GitHub sync (optional): one JSON file in a private repo; per-record last-write-wins merge; retries on sha conflict
const GKEY='daily.gh';
let G=(()=>{try{return JSON.parse(st.get(GKEY))||{}}catch(e){return{}}})();
const gOK=()=>!!(G.owner&&G.repo&&G.token);
const SY={busy:false,again:false,dirty:false,t:0,state:'',msg:'',tm:0};
const b64enc=s=>{const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=32768)x+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(x)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const gUrl=()=>'https://api.github.com/repos/'+encodeURIComponent(G.owner)+'/'+encodeURIComponent(G.repo)+'/contents/'+(G.path||'data.json').split('/').map(encodeURIComponent).join('/');
const gH=x=>({Authorization:'Bearer '+G.token,Accept:'application/vnd.github+json',...x});
const gErr=(r,w)=>new Error(r.status===401?'neveljaven ali potekel žeton (401)':r.status===403||(w&&r.status===404)?'žeton nima pravic za ta repozitorij ('+r.status+')':r.status===404?'repozitorij ne obstaja (404)':(w?'pisanje ':'branje ')+r.status);
async function gGet(){const r=await fetch(gUrl(),{headers:gH(),cache:'no-store'});
if(r.status===404){const rr=await fetch('https://api.github.com/repos/'+encodeURIComponent(G.owner)+'/'+encodeURIComponent(G.repo),{headers:gH(),cache:'no-store'});if(!rr.ok)throw gErr(rr);return{sha:null,data:null}}
if(!r.ok)throw gErr(r);const j=await r.json();let t;
if(j.content&&j.encoding==='base64')t=b64dec(j.content);else{const r2=await fetch(gUrl(),{headers:gH({Accept:'application/vnd.github.raw+json'}),cache:'no-store'});if(!r2.ok)throw gErr(r2);t=await r2.text()}
return{sha:j.sha,data:t.trim()?JSON.parse(t):null}}
async function gPut(d,sha){const body={message:'sync '+(/Android/i.test(navigator.userAgent)?'android':'pc')+' '+new Date().toISOString().slice(0,16),content:b64enc(JSON.stringify(d))};if(sha)body.sha=sha;
const r=await fetch(gUrl(),{method:'PUT',headers:gH({'Content-Type':'application/json'}),body:JSON.stringify(body)});if(r.status===409||r.status===422)return false;if(!r.ok)throw gErr(r,1);return true}
const differs=(m,d)=>COLS.some(c=>Object.entries(m[c]).some(([id,r])=>!(d[c]&&d[c][id])||(d[c][id].u||0)!==(r.u||0)));
function sStat(s,m){SY.state=s;SY.msg=m||'';const b=$('#sy');if(!b)return;b.hidden=!gOK();b.className='sy '+s;b.textContent={ok:'✓',pend:'↑',busy:'⟳',err:'⚠'}[s]||'⟳';b.title=s==='err'?'Napaka: '+SY.msg:s==='ok'?'Sinhronizirano '+hm(SY.t):'Sinhronizacija'}
function schedSync(ms){clearTimeout(SY.tm);SY.tm=setTimeout(sync,ms);if(!SY.busy&&SY.state!=='err')sStat('pend')}
async function sync(){if(!gOK())return;if(SY.busy){SY.again=true;return}clearTimeout(SY.tm);SY.busy=true;SY.dirty=false;sStat('busy');
try{let ok=false,changed=false;for(let a=0;a<4&&!ok;a++){const{sha,data}=await gGet(),rem=data&&typeof data==='object'?merge(empty(),data):null,m=rem?merge(rem,S):merge(empty(),S),prev=S;
S=merge(S,m);if(differs(S,prev))changed=true;ok=rem&&!differs(m,rem)?true:await gPut(m,sha)}
if(!ok)throw new Error('konflikt, poskusi znova');flush();SY.t=now();sStat('ok');
if(changed){const a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA)$/.test(a.tagName))render()}}
catch(e){sStat('err',e.message==='Failed to fetch'?'ni povezave':e.message)}
finally{SY.busy=false;if(SY.again||SY.dirty){SY.again=false;schedSync(3000)}}}

expMd:()=>{const by={};live('notes').sort((a,b)=>a.c-b.c).forEach(n=>(by[ncat(n)]=by[ncat(n)]||[]).push(n));exportFile('zaznamki-'+today()+'.md',Object.entries(by).map(([c,a])=>'### '+c+'\n\n'+a.map(n=>'*'+dk(new Date(n.c))+'*\n\n'+n.text.trim()).join('\n\n---\n\n')).join('\n\n')+'\n','text/markdown')},
inbdel:(b,id)=>{const r=S.inbox[id];r.del=1;put('inbox',r);render()},
sug:b=>{addShop([b.dataset.t],V.cat);render()},
clearShop:()=>{live('shop').filter(r=>r.done&&catOf(r)===V.cat).forEach(r=>{r.del=1;put('shop',r)});render()},
shareShop:()=>share('Nakupi – '+CATN[V.cat]+':\n'+openShop(V.cat).map(r=>'• '+r.text).join('\n')),
shareTodos:()=>{const td=today();share('Opravila:\n'+live('todos').filter(t=>!t.done).sort(byDue).map(t=>'• '+t.text+(t.due?' ('+dueLbl(t.due,td)+')':'')).join('\n'))},
range:b=>{V.range=+b.dataset.n;render()},
settings:()=>openSheet(settingsHTML()),
syncNow:()=>{sync().then(()=>toast(SY.state==='ok'?'Sinhronizirano':'Napaka: '+SY.msg))},
gSave:()=>{const tok=$('#gT').value.trim()||G.token;G={owner:$('#gO').value.trim(),repo:$('#gR').value.trim(),path:'data.json',token:tok};st.set(GKEY,JSON.stringify(G));
if(!gOK())return toast('Manjka lastnik, repozitorij ali žeton');sync().then(()=>{toast(SY.state==='ok'?'Sinhronizirano':'Napaka: '+SY.msg);if($('#gO'))openSheet(settingsHTML())})},
gOff:()=>{G={};st.set(GKEY,'{}');sStat('');closeSheet();toast('Sinhronizacija izklopljena (podatki ostanejo lokalno)')},
closeSheet:()=>closeSheet(),
copy:()=>copyTA(),
expJson:()=>exportFile('daily-'+today()+'.json',JSON.stringify(S),'application/json'),
expCsv:()=>exportFile('dnevnik-'+today()+'.csv',csv(),'text/csv'),
wipe:b=>{if(b.dataset.armed){S=empty();clearTimeout(saveT);st.set(KEY,JSON.stringify(S));closeSheet();render();toast('Vsi podatki izbrisani')}else{b.dataset.armed=1;b.textContent='Res izbrišem vse? Tapni še enkrat.'}}
};
document.addEventListener('click',e=>{const t=e.target;if(t.closest('a[href]'))return;
if(t.id==='sheet')return closeSheet();
const nb=t.closest('nav button[data-tab]');if(nb){V.tab=nb.dataset.tab;render();scrollTo(0,0);return}
if(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
const b=t.closest('[data-a]');if(!b)return;
const f=A[b.dataset.a];if(f){e.preventDefault();f(b,b.dataset.id)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const id=e.target.id;if(id==='nT'&&(e.ctrlKey||e.metaKey)){e.preventDefault();return A.addNote()}if(id==='tT'||id==='tD'){e.preventDefault();A.addTodo()}else if(id==='sT'){e.preventDefault();A.addShop()}});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(t.id==='nT')V.ndraft=t.value;
if(t.id==='hQ'){V.hq=t.value;V.hn=30;clearTimeout(V.qT);V.qT=setTimeout(()=>{render();const i=$('#hQ');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)}
if(t.id==='nQ'){V.nq=t.value;clearTimeout(V.qT);V.qT=setTimeout(()=>{render();const i=$('#nQ');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)}
if(f&&(t.tagName==='TEXTAREA'||t.type==='text'))sf(V.day,f,t.value)});
document.addEventListener('change',e=>{const t=e.target;
if(t.dataset.f&&t.type==='time'){sf(V.day,t.dataset.f,t.value||null);render()}
else if(t.id==='swH'||t.id==='swM'){const H=$('#swH').value,M=$('#swM').value;sf(V.day,'sw',H===''&&M===''?null:Math.max(0,Math.round((+H||0)*60+(+M||0))))}
else if(t.id==='stepsI'){const v=t.value.trim();sf(V.day,'steps',v===''?null:Math.max(0,Math.round(+v)))}
else if(t.id==='imp')importFile(t.files[0])});
document.addEventListener('toggle',e=>{if(e.target.id==='doneD')V.doneOpen=e.target.open},true);
addEventListener('visibilitychange',()=>{if(document.hidden){flush();if(SY.dirty)sync()}else{const t=today();if(t!==V.last){if(V.day===V.last)V.day=t;V.last=t;render()}sync()}});
addEventListener('online',()=>sync());setInterval(()=>{if(!document.hidden)sync()},300000);
addEventListener('pagehide',flush);
addEventListener('storage',e=>{if(e.key!==KEY)return;try{const d=JSON.parse(e.newValue);S=d?merge(S,d):empty();const a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA)$/.test(a.tagName))render()}catch(x){}});
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(drawCharts,150)});

// ---------- incoming share (?title=&text=&url=) -> inbox. Used later by the PWA share_target on Android.
function migrateLegacy(){Object.values(S.log).forEach(r=>{const[d,f]=r.id.split('|');if((f==='sp'||f==='med')&&r.v){const id='leg'+f+'|'+d;if(!S.acts[id])put('acts',{id,t:pd(d).setHours(12,0,0,0),c:f==='sp'?'Šport':'Meditacija',m:f==='sp'?(r.v===61?60:r.v):10});r.v=null;put('log',r)}})}
migrateLegacy();
(()=>{if(S.cfg.mig19)return;const c=S.cfg.chores,a=S.cfg.acts;
if(c&&Array.isArray(c.v)&&c.v.length){const rooms=c.v.map(l=>l.split(':')[0].trim());const add=DEFL.chores.filter(l=>['Klet','Podstreha','Avto','Popravila'].includes(l.split(':')[0])&&!rooms.includes(l.split(':')[0]));if(add.length)put('cfg',{id:'chores',v:[...c.v,...add]})}
if(a&&Array.isArray(a.v)&&a.v.length&&!a.v.includes('Kitara'))put('cfg',{id:'acts',v:[...a.v,'Kitara']});if((c&&c.v)||(a&&a.v))put('cfg',{id:'mig19',v:1})})();
setInterval(()=>{if(!LOCK)updRun()},15000);
const VER='1.9';
function checkUpd(){if(LOCK||location.protocol!=='https:')return;fetch('version.txt?t='+now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{t=t.trim();const b=$('#upd');if(b&&t&&t!==VER){b.hidden=false;b.textContent='↻ v'+t}}).catch(()=>{})}
setInterval(checkUpd,1800000);addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpd()});
let shared=false;
try{const q=new URLSearchParams(location.search),sh=[q.get('title'),q.get('text'),q.get('url')].filter(Boolean).join('\n').trim();
if(sh){shared=true;V.shareId=uid();put('inbox',{id:V.shareId,text:sh,c:now()});flush();V.tab='opravila';history.replaceState(null,'',location.pathname)}}catch(e){}
// Decoy: a visitor without any data sees a bare 404. Unlock: tap "404" 5x quickly (flag stays on this device).
// Obscurity only: the source is public, but there is no data on the page anyway.
if(!st.get('daily.ok')&&count()===0&&!gOK()&&!shared){LOCK=true;document.title='404 Not Found';
document.body.innerHTML='<div id="lk" style="font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:18vh auto 0;padding:0 24px;color:#52514e;user-select:none"><h1 style="font-size:56px;font-weight:600;color:#0b0b0b">404</h1><p>Not Found</p></div>';
let n=0,t0=0;$('#lk').addEventListener('click',()=>{const t=Date.now();n=t-t0<700?n+1:1;t0=t;if(n>=5){st.set('daily.ok','1');location.reload()}})}
else{st.set('daily.ok','1');render();sStat('');sync();checkUpd();if(V.shareId)fileSheet(V.shareId)}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
