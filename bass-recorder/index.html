<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bass Recorder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#10172e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --enclosure:#10172e;   /* pedal-blue base */
    --panel:#18213f;
    --panel-2:#202a4d;
    --silk:#dfe3ec;        /* silkscreen silver */
    --dim:#8b93a7;
    --rule:#2c3760;
    --led-red:#ff4d4f;
    --led-green:#5be39a;
    --led-amber:#ffb547;
  }
  *{box-sizing:border-box}
  html,body{background:var(--enclosure)}
  body{margin:0;color:var(--silk);font:16px/1.45 Barlow,system-ui,sans-serif;padding:20px 16px 40px}
  .wrap{max-width:820px;margin:0 auto}
  h1,h2,.cond{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:.01em}
  button,select,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--led-amber);outline-offset:2px}

  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:34px;font-weight:700;margin:0;flex:1;line-height:1}
  .input{display:flex;align-items:center;gap:8px}
  select{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;max-width:260px}
  .ghost{background:transparent;border:1px solid var(--rule);border-radius:8px;padding:8px 12px;cursor:pointer}
  .ghost:hover{background:var(--panel)}

  /* the deck: footswitch + scope */
  .deck{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:stretch;
        background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:18px}
  .switch{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:150px}
  .led{width:12px;height:12px;border-radius:50%;background:#3a1d24;box-shadow:inset 0 0 2px #000}
  .led.on{background:var(--led-red);box-shadow:0 0 10px var(--led-red),0 0 2px #fff inset}
  #rec{width:118px;height:118px;border-radius:50%;cursor:pointer;border:0;
       background:radial-gradient(circle at 50% 38%,#eef1f6 0,#b9c0cd 38%,#7d8597 70%,#4d5466 100%);
       box-shadow:0 6px 0 #0a0f20,0 10px 18px rgba(0,0,0,.45),inset 0 -3px 6px rgba(0,0,0,.35);
       transition:transform .06s,box-shadow .06s}
  #rec:active,#rec.on{transform:translateY(4px);box-shadow:0 2px 0 #0a0f20,0 4px 10px rgba(0,0,0,.45),inset 0 -2px 5px rgba(0,0,0,.35)}
  #rec:disabled{opacity:.45;cursor:not-allowed}
  .switch .cond{font-size:20px;font-weight:700}
  .switch .hint{font-size:13px;color:var(--dim)}
  kbd{font:600 12px Barlow,sans-serif;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel-2)}

  .scope{position:relative;min-height:170px;border-radius:12px;background:#0b1124;border:1px solid var(--rule);overflow:hidden}
  #scope{position:absolute;inset:0;width:100%;height:100%}
  .readout{position:absolute;right:12px;top:8px;font:700 28px "Barlow Condensed",sans-serif;color:var(--led-green)}
  .readout.hot{color:var(--led-red)}
  .timer{position:absolute;left:12px;top:8px;font:700 28px "Barlow Condensed",sans-serif;color:var(--dim)}
  .timer.on{color:var(--led-red)}
  .bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:#141c38}
  .bar i{display:block;height:100%;width:0;background:var(--led-green)}
  .bar i.hot{background:var(--led-red)}
  .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);text-align:center;padding:16px}

  /* options */
  .opts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:14px 2px 26px;color:var(--dim);font-size:15px}
  .opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .opts input[type=number]{width:62px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:4px 6px}
  input[type=checkbox]{accent-color:var(--led-green);width:16px;height:16px}
  .folder{margin-left:auto;display:flex;gap:8px;align-items:center}
  #dirinfo{color:var(--silk)}

  /* takes */
  h2{font-size:24px;font-weight:700;margin:0 0 10px}
  #list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
  #list li{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:14px;align-items:center;
           padding:10px 4px;border-bottom:1px solid var(--rule)}
  #list li.playing{background:linear-gradient(90deg,rgba(91,227,154,.08),transparent 60%)}
  #list li.none{display:block;color:var(--dim);padding:14px 4px}
  .tname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tmeta{font-size:13px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
  .tmeta .warn{color:var(--led-amber)}
  .thumb{width:180px;height:36px}
  .acts{display:flex;gap:6px}
  .acts button{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--panel);cursor:pointer;display:grid;place-items:center}
  .acts button:hover{background:var(--panel-2)}
  .acts button.active{border-color:var(--led-green);color:var(--led-green)}
  .acts svg{width:16px;height:16px;fill:currentColor}

  @media (max-width:620px){
    .deck{grid-template-columns:1fr}
    .scope{min-height:140px}
    #list li{grid-template-columns:minmax(0,1fr) auto}
    .thumb{display:none}
    .folder{margin-left:0}
  }
  @media (prefers-reduced-motion:reduce){#rec{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bass Recorder</h1>
    <div class="input">
      <select id="dev" aria-label="Vhod"><option value="">Vhod ni izbran</option></select>
      <button id="enable" class="ghost">Poveži vhod</button>
    </div>
  </header>

  <section class="deck">
    <div class="switch">
      <span id="led" class="led" aria-hidden="true"></span>
      <button id="rec" disabled aria-label="Snemaj"></button>
      <span id="reclabel" class="cond">Snemaj</span>
      <span class="hint"><kbd>Space</kbd> začni / ustavi</span>
    </div>
    <div class="scope">
      <canvas id="scope"></canvas>
      <span id="timer" class="timer">0:00</span>
      <span id="db" class="readout">−∞ dB</span>
      <div class="bar"><i id="m"></i></div>
      <div id="empty" class="empty">Poveži vhod (ME-90B), potem pritisni Space.</div>
    </div>
  </section>

  <div class="opts">
    <label><input type="checkbox" id="norm" checked> Normaliziraj na <input type="number" id="tgt" value="-1" step="0.5" aria-label="Cilj v dBFS"> dBFS</label>
    <label><input type="checkbox" id="autosave" checked> Shrani samodejno</label>
    <label><input type="checkbox" id="autoloop"> Po snemanju vrti v zanki</label>
    <div class="folder">
      <span id="dirinfo">Shranjuje v Prenose</span>
      <button id="unlock" class="ghost" style="display:none">Odpri mapo</button>
      <button id="pickdir" class="ghost">Izberi mapo</button>
    </div>
  </div>

  <h2>Posnetki</h2>
  <ul id="list"></ul>
  <p class="opts" style="margin-top:12px"><span><kbd>L</kbd> zanka zadnjega posnetka</span><span><kbd>Esc</kbd> ustavi predvajanje</span></p>
</div>

<script>
const $ = id => document.getElementById(id);
let ctx, stream, src, proc, mon, recording = false, chunks = [], chCount = 1, takes = [], player = null;
let lastBuf = null, peakHold = 0, recStart = 0, decodeCtx = null;

const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
const ICON = {
  play:'<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>',
  loop:'<svg viewBox="0 0 16 16"><path d="M3 6a4 4 0 0 1 7-2.6L8.5 5H13V.5l-1.6 1.6A6 6 0 0 0 1 6zm10 4a4 4 0 0 1-7 2.6L7.5 11H3v4.5l1.6-1.6A6 6 0 0 0 15 10z"/></svg>',
  stop:'<svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1"/></svg>',
  save:'<svg viewBox="0 0 16 16"><path d="M7 1h2v7.6l2.6-2.6L13 7.4 8 12.4 3 7.4 4.4 6 7 8.6zM2 13h12v2H2z"/></svg>'
};

// ---------- input
async function listDevices(){
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
  const saved = store.get('dev');
  $('dev').innerHTML = devs.map(d => `<option value="${d.deviceId}">${(d.label || 'Vhod').replace(/</g,'&lt;')}</option>`).join('');
  const pick = devs.find(d => d.deviceId === saved) || devs.find(d => /me-?90|boss/i.test(d.label));
  if (pick) $('dev').value = pick.deviceId;
}

// Capture runs on the audio thread (AudioWorklet) so UI work can't cause dropouts/clicks.
const WORKLET = `class Cap extends AudioWorkletProcessor{
  constructor(o){super();this.nc=o.processorOptions.nc;}
  process(inp){const i=inp[0];if(!i||!i.length)return true;
    const bufs=[];let pk=0;
    for(let c=0;c<this.nc;c++){const d=i[Math.min(c,i.length-1)];bufs.push(d.slice());
      for(let k=0;k<d.length;k++){const a=d[k]<0?-d[k]:d[k];if(a>pk)pk=a;}}
    this.port.postMessage({bufs,pk},bufs.map(b=>b.buffer));return true;}}
registerProcessor('cap',Cap);`;

async function openInput(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  const id = $('dev').value;
  stream = await navigator.mediaDevices.getUserMedia({ audio: {
    deviceId: id ? { exact: id } : undefined,
    echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: { ideal: 2 } } });
  const st = stream.getAudioTracks()[0].getSettings();
  chCount = Math.min(2, st.channelCount || 1);
  if (!ctx || (st.sampleRate && ctx.sampleRate !== st.sampleRate)) {
    if (ctx) await ctx.close();
    ctx = new AudioContext(st.sampleRate ? { sampleRate: st.sampleRate, latencyHint: 'playback' } : { latencyHint: 'playback' });
    await ctx.audioWorklet.addModule('data:text/javascript;charset=utf-8,' + encodeURIComponent(WORKLET));
  }
  await ctx.resume();
  if (src) src.disconnect();
  if (proc) { proc.port.onmessage = null; proc.disconnect(); }
  src = ctx.createMediaStreamSource(stream);
  proc = new AudioWorkletNode(ctx, 'cap', { numberOfInputs: 1, numberOfOutputs: 1, channelCount: chCount,
    channelCountMode: 'explicit', processorOptions: { nc: chCount } });
  mon = ctx.createGain(); mon.gain.value = 0; // no monitoring through the computer
  proc.port.onmessage = ({ data }) => {
    if (recording) chunks.push(data.bufs);
    lastBuf = data.bufs[0];
    peakHold = Math.max(peakHold * 0.92, data.pk);
  };
  src.connect(proc); proc.connect(mon); mon.connect(ctx.destination);
  $('rec').disabled = false; $('empty').style.display = 'none';
  $('enable').textContent = 'Znova poveži';
}

$('enable').onclick = async () => {
  try { await openInput(); await listDevices(); await openInput(); }
  catch (err) { alert('Vhoda ni mogoče odpreti: ' + (err.message || err.name) + '\nPreveri, ali je ME-90B priključen prek USB.'); }
};
$('dev').onchange = async () => { store.set('dev', $('dev').value); try { await openInput(); } catch (err) { alert(err.message); } };

// ---------- scope + meter (one animation loop)
function drawScope(){
  const c = $('scope'), dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr || c.height !== h * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const g = c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  g.strokeStyle = '#1c2547'; g.lineWidth = 1; g.beginPath(); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();
  if (lastBuf) {
    g.strokeStyle = recording ? '#ff4d4f' : '#5be39a'; g.lineWidth = 2; g.beginPath();
    const n = lastBuf.length;
    for (let x = 0; x < w; x++) { const v = lastBuf[Math.floor(x / w * n)] || 0; const y = h/2 - v * h * 0.45; x ? g.lineTo(x,y) : g.moveTo(x,y); }
    g.stroke();
  }
  const db = peakHold > 0 ? 20 * Math.log10(peakHold) : -Infinity;
  $('m').style.width = Math.max(0, Math.min(100, (db + 60) / 60 * 100)) + '%';
  const hot = db > -1; $('m').classList.toggle('hot', hot); $('db').classList.toggle('hot', hot);
  $('db').textContent = (isFinite(db) ? db.toFixed(1) : '−∞') + ' dB';
  if (recording) { const s = Math.floor((performance.now() - recStart) / 1000); $('timer').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
  requestAnimationFrame(drawScope);
}
requestAnimationFrame(drawScope);

// ---------- record
function setRecUi(on){
  $('rec').classList.toggle('on', on); $('led').classList.toggle('on', on); $('timer').classList.toggle('on', on);
  $('reclabel').textContent = on ? 'Ustavi' : 'Snemaj'; $('rec').setAttribute('aria-label', on ? 'Ustavi' : 'Snemaj');
}
function toggleRec(){
  if ($('rec').disabled) return;
  if (!recording) { stopPlay(); chunks = []; recording = true; recStart = performance.now(); $('timer').textContent = '0:00'; setRecUi(true); }
  else { recording = false; setRecUi(false); finishTake(); }
}
$('rec').onclick = toggleRec;

function peaksOf(d, bins = 180){
  const out = new Float32Array(bins), step = d.length / bins;
  for (let b = 0; b < bins; b++) { let m = 0; const e = Math.min(d.length, Math.floor((b + 1) * step));
    for (let i = Math.floor(b * step); i < e; i++) { const a = d[i] < 0 ? -d[i] : d[i]; if (a > m) m = a; } out[b] = m; }
  return out;
}

function finishTake(){
  if (!chunks.length) return;
  const len = chunks.reduce((s, b) => s + b[0].length, 0);
  const ch = [];
  for (let c = 0; c < chCount; c++) { const out = new Float32Array(len); let o = 0; for (const b of chunks) { out.set(b[c], o); o += b[c].length; } ch.push(out); }
  let pk = 0; for (const d of ch) for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > pk) pk = a; }
  const rawDb = pk > 0 ? 20 * Math.log10(pk) : -Infinity;
  let gainDb = 0;
  if ($('norm').checked && pk > 0) { gainDb = parseFloat($('tgt').value || '-1') - rawDb; const g = Math.pow(10, gainDb / 20); for (const d of ch) for (let i = 0; i < d.length; i++) d[i] *= g; }
  const ts = new Date(), p = n => String(n).padStart(2, '0');
  const name = `bass_${ts.getFullYear()}${p(ts.getMonth()+1)}${p(ts.getDate())}_${p(ts.getHours())}${p(ts.getMinutes())}${p(ts.getSeconds())}.wav`;
  const blob = encodeWav(ch, ctx.sampleRate);
  const take = { name, blob, url: URL.createObjectURL(blob), secs: len / ctx.sampleRate, rawDb, gainDb, mtime: Date.now(), peaks: peaksOf(ch[0]) };
  takes.unshift(take); render();
  if ($('autosave').checked) download(take);
  if ($('autoloop').checked) play(take, true);
}

function encodeWav(ch, sr){
  const n = ch[0].length, nc = ch.length, bps = 3, buf = new ArrayBuffer(44 + n * nc * bps), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36 + n*nc*bps, true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,nc,true); v.setUint32(24,sr,true);
  v.setUint32(28,sr*nc*bps,true); v.setUint16(32,nc*bps,true); v.setUint16(34,24,true); w(36,'data'); v.setUint32(40,n*nc*bps,true);
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < nc; c++) {
    const s = Math.max(-1, Math.min(1, ch[c][i])); const x = Math.round(s < 0 ? s * 0x800000 : s * 0x7FFFFF);
    v.setUint8(o, x & 255); v.setUint8(o+1, (x >> 8) & 255); v.setUint8(o+2, (x >> 16) & 255); o += 3;
  }
  return new Blob([buf], { type: 'audio/wav' });
}

// ---------- folder (File System Access API), fallback = normal download
let dirHandle = null;
const idb = (mode, fn) => new Promise((res, rej) => {
  const r = indexedDB.open('bass-recorder', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => { const tx = r.result.transaction('kv', mode); const q = fn(tx.objectStore('kv')); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); };
  r.onerror = () => rej(r.error);
});
async function dirReady(ask){
  if (!dirHandle) return false;
  const opts = { mode: 'readwrite' };
  if (await dirHandle.queryPermission(opts) === 'granted') return true;
  return ask && await dirHandle.requestPermission(opts) === 'granted';
}
async function showDir(){
  if (!dirHandle) { $('dirinfo').textContent = 'Shranjuje v Prenose'; $('unlock').style.display = 'none'; render(); return; }
  const ok = await dirReady(false);
  $('unlock').style.display = ok ? 'none' : '';
  $('dirinfo').textContent = 'Mapa: ' + dirHandle.name;
  if (ok) await loadFolder(); else render();
}
async function loadFolder(){
  const found = [];
  for await (const h of dirHandle.values()) {
    if (h.kind !== 'file' || !/\.(wav|mp3|m4a|flac|ogg)$/i.test(h.name)) continue;
    if (takes.some(t => t.name === h.name)) continue;
    const f = await h.getFile();
    found.push({ name: h.name, blob: f, url: URL.createObjectURL(f), mtime: f.lastModified, saved: dirHandle.name, fromDisk: true });
  }
  takes = takes.concat(found).sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
  render();
}
if (!('showDirectoryPicker' in window)) $('pickdir').style.display = 'none';
$('pickdir').onclick = async () => {
  try { dirHandle = await showDirectoryPicker({ id: 'bass-recorder', mode: 'readwrite' });
        await idb('readwrite', s => s.put(dirHandle, 'dir')); takes = takes.filter(t => !t.fromDisk); showDir(); }
  catch (e) { if (e.name !== 'AbortError') alert(e.message); }
};
$('unlock').onclick = async () => { if (await dirReady(true)) showDir(); };
(async () => { try { dirHandle = await idb('readonly', s => s.get('dir')) || null; } catch {} showDir(); })();

async function download(t){
  try {
    if (await dirReady(true)) {
      const fh = await dirHandle.getFileHandle(t.name, { create: true });
      const w = await fh.createWritable(); await w.write(t.blob); await w.close();
      t.saved = dirHandle.name; render(); showDir(); return;
    }
  } catch (e) { console.warn('folder save failed, falling back to download', e); }
  const a = document.createElement('a'); a.href = t.url; a.download = t.name; document.body.appendChild(a); a.click(); a.remove();
  t.saved = 'Prenosi'; render();
}

// ---------- playback
function play(t, loop){
  stopPlay();
  player = new Audio(t.url); player.loop = loop; player._t = t; player._loop = loop; player.play();
  player.onended = () => { player = null; render(); };
  render();
}
function stopPlay(){ if (player) { player.pause(); player = null; render(); } }

// ---------- list
async function ensurePeaks(t){
  if (t.peaks || t._decoding) return;
  t._decoding = true;
  try {
    decodeCtx = decodeCtx || new OfflineAudioContext(1, 1, 44100);
    const ab = await decodeCtx.decodeAudioData(await t.blob.arrayBuffer());
    t.peaks = peaksOf(ab.getChannelData(0)); t.secs = ab.duration; render();
  } catch { t.peaks = new Float32Array(0); }
}
function drawThumb(cv, t, active){
  const dpr = devicePixelRatio || 1, w = 180, h = 36; cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  if (!t.peaks || !t.peaks.length) { g.fillStyle = '#2c3760'; g.fillRect(0, h/2 - 1, w, 2); return; }
  let mx = 0; for (const v of t.peaks) if (v > mx) mx = v; mx = mx || 1;
  g.fillStyle = active ? '#5be39a' : '#8b93a7';
  const bw = w / t.peaks.length;
  t.peaks.forEach((v, i) => { const bh = Math.max(1, v / mx * (h - 4)); g.fillRect(i * bw, (h - bh) / 2, Math.max(1, bw - .5), bh); });
}
function fmtTime(ms){ return new Date(ms).toLocaleString('sl-SI', { day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit' }); }
function render(){
  const ul = $('list'); ul.innerHTML = '';
  if (!takes.length) { ul.innerHTML = '<li class="none">Še ni posnetkov. Pritisni Space in zaigraj.</li>'; return; }
  takes.forEach(t => {
    const active = player && player._t === t;
    const li = document.createElement('li'); if (active) li.classList.add('playing');
    const info = document.createElement('div');
    const nm = document.createElement('div'); nm.className = 'tname'; nm.textContent = t.name;
    const meta = document.createElement('div'); meta.className = 'tmeta';
    const add = (txt, cls) => { const s = document.createElement('span'); s.textContent = txt; if (cls) s.className = cls; meta.append(s); };
    if (t.mtime) add(fmtTime(t.mtime));
    if (t.secs != null) add(t.secs.toFixed(1) + ' s');
    if (t.rawDb != null) add('vrh ' + (isFinite(t.rawDb) ? t.rawDb.toFixed(1) : '−∞') + ' dB' + (t.gainDb ? `, normalizirano ${t.gainDb >= 0 ? '+' : ''}${t.gainDb.toFixed(1)} dB` : ''));
    if (t.rawDb > -0.3) add('Vhod je clippal', 'warn');
    if (t.saved && !(dirHandle && t.saved === dirHandle.name)) add('Shranjeno v ' + t.saved);
    info.append(nm, meta);
    const cv = document.createElement('canvas'); cv.className = 'thumb'; drawThumb(cv, t, active);
    const acts = document.createElement('div'); acts.className = 'acts';
    const mk = (icon, label, fn, on) => { const b = document.createElement('button'); b.innerHTML = ICON[icon]; b.title = label; b.setAttribute('aria-label', label); if (on) b.classList.add('active'); b.onclick = fn; return b; };
    acts.append(mk('play', 'Predvajaj', () => play(t, false), active && !player._loop),
                mk('loop', 'Predvajaj v zanki', () => play(t, true), active && player._loop),
                mk('stop', 'Ustavi', stopPlay));
    if (!t.fromDisk && !t.saved) acts.append(mk('save', 'Shrani', () => download(t)));
    li.append(info, cv, acts); ul.append(li);
    if (!t.peaks) ensurePeaks(t);
  });
}
render();

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); toggleRec(); }
  else if (e.code === 'KeyL' && takes[0]) play(takes[0], true);
  else if (e.code === 'Escape') stopPlay();
});
// Space must only toggle recording, never also "click" a focused button.
document.addEventListener('keyup', e => { if (e.code === 'Space' && e.target.tagName === 'BUTTON') e.preventDefault(); });
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
