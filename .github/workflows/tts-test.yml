name: tts-test
# Manual test: Slovenian sample read by free TTS engines (edge-tts Petra/Rok, Piper artur) -> artifact with MP3s
on: workflow_dispatch
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Sample text (first part of the Tambora story)
        run: |
          python3 - <<'PY'
          import re
          s=open('daily/branje/2026-11-23-tambora.md',encoding='utf-8').read()
          s=re.sub(r'^---[\s\S]*?\n---\n','',s); s=re.sub(r'```svg[\s\S]*?```','',s)
          paras=[p.strip() for p in s.split('\n\n') if p.strip() and not p.strip().startswith(('#','*','!','-'))]
          out='\n\n'.join(paras[:5]); open('sample.txt','w',encoding='utf-8').write(out); print(len(out),'chars'); print(out)
          PY
      - name: edge-tts (Microsoft Petra, Rok)
        run: |
          pip install -q edge-tts
          mkdir -p out
          edge-tts --voice sl-SI-PetraNeural -f sample.txt --write-media out/1_edge_petra.mp3 || echo "PETRA FAIL"
          edge-tts --voice sl-SI-RokNeural -f sample.txt --write-media out/2_edge_rok.mp3 || echo "ROK FAIL"
          edge-tts --list-voices | grep -i sl-SI || true
      - name: Piper (open source, voice artur)
        run: |
          sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q piper-tts
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/sl/sl_SI/artur/medium
          curl -sSL -o artur.onnx $B/sl_SI-artur-medium.onnx && curl -sSL -o artur.onnx.json $B/sl_SI-artur-medium.onnx.json
          (python3 -m piper -m artur.onnx -f out/3_piper_artur.wav < sample.txt || piper --model artur.onnx --output_file out/3_piper_artur.wav < sample.txt) || echo "PIPER FAIL"
          [ -f out/3_piper_artur.wav ] && ffmpeg -loglevel error -y -i out/3_piper_artur.wav -b:a 96k out/3_piper_artur.mp3 && rm out/3_piper_artur.wav || true
          ls -la out
      - name: Commit samples to daily/tts-test/
        run: |
          mkdir -p daily/tts-test && cp out/*.mp3 daily/tts-test/
          git config user.name "daily-bot"; git config user.email "daily-bot@users.noreply.github.com"
          git add daily/tts-test && git commit -m "tts-test: samples" && git pull --rebase -q && git push
