name: daily-videos
on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 06:17 CET; also manual: Actions -> daily-videos -> Run workflow
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-videos
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 daily/tools/videos.py
      - name: commit
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add daily/lekcije/feed.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "lekcije: feed update"
          git pull --rebase origin main
          git push
