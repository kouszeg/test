name: daily-audio
# Narrates Branje stories with Gemini TTS (free tier, secret GEMINI_KEY) -> Opus files as assets of release 'audio'
# (no repo growth); only daily/branje/audio/index.json is committed, then Pages is redeployed.
# Free quota is ~10 requests/day per TTS model; unfinished stories continue on the next (daily) run.
on:
  workflow_dispatch:
    inputs:
      mode: {description: 'stories | samples | story | ab (story at bitrates in voices field)', default: 'stories'}
      story: {description: 'story id(s) for mode story', default: ''}
      models: {description: 'TTS model order (comma separated, optional)', default: ''}
      voices: {description: 'voices for samples (comma separated)', default: 'Charon,Algieba,Schedar,Sadaltager'}
  push:
    branches: [main]
    paths: ['daily/branje/*.md']
  schedule:
    - cron: '41 9 * * *'   # daily, after the quota reset (midnight Pacific)
permissions:
  contents: write
  actions: write
concurrency: {group: daily-audio, cancel-in-progress: false}
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
          ffmpeg -hide_banner -encoders | grep -q libopus && echo "ffmpeg ok"
      - name: Release + unfinished parts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release view audio >/dev/null 2>&1 || gh release create audio --title "Daily audio" --notes "Narrated Branje stories (generated by daily-audio)." --latest=false
          mkdir -p daily/branje/audio/parts
          gh release download audio -p 'part_*' -D daily/branje/audio/parts 2>/dev/null || true
          ls daily/branje/audio/parts | head
      - name: Narrate
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          MODE: ${{ github.event.inputs.mode }}
          VOICES: ${{ github.event.inputs.voices }}
          STORY: ${{ github.event.inputs.story }}
          TTS_MODELS: ${{ github.event.inputs.models }}
        run: |
          if [ "$MODE" = "samples" ]; then python3 -u daily/tools/audio.py samples "$VOICES"
          elif [ "$MODE" = "story" ]; then python3 -u daily/tools/audio.py story "$STORY"
          elif [ "$MODE" = "ab" ]; then python3 -u daily/tools/audio.py ab "$STORY" "$VOICES"
          else python3 -u daily/tools/audio.py; fi
      - name: Upload to release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          R=daily/branje/audio/_release.json
          [ -f $R ] || exit 0
          for f in $(python3 -c "import json;print(' '.join(json.load(open('$R'))['upload']))"); do gh release upload audio "$f" --clobber; echo "up $f"; done
          for a in $(python3 -c "import json;print(' '.join(json.load(open('$R'))['delete']))"); do gh release delete-asset audio "$a" -y && echo "del $a" || true; done
          rm -f $R
      - name: Commit and redeploy
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git config user.name "daily-bot"; git config user.email "daily-bot@users.noreply.github.com"
          [ -f daily/branje/audio/index.json ] && git add daily/branje/audio/index.json
          [ -d daily/tts-test ] && git add -A daily/tts-test
          git status --short | head -20
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "audio: narration" && git pull --rebase -q && git push -q
          gh workflow run pages.yml
