name: daily-audio
# Narrates Branje stories with Gemini TTS (free tier, secret GEMINI_KEY) -> daily/branje/audio/*.mp3, then redeploys Pages.
# Free quota is ~10 requests/day per TTS model; unfinished stories continue on the next (daily) run.
on:
  workflow_dispatch:
    inputs:
      mode: {description: 'stories | samples | story', default: 'stories'}
      story: {description: 'story id(s) for mode story', default: ''}
      voices: {description: 'voices for samples (comma separated)', default: 'Charon,Algieba,Schedar,Sadaltager'}
  push:
    branches: [main]
    paths: ['daily/branje/*.md']
  schedule:
    - cron: '41 9 * * *'   # daily, after the quota reset (midnight Pacific)
permissions:
  contents: write
  actions: write
concurrency: {group: daily-audio, cancel-in-progress: false}
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq install -y ffmpeg >/dev/null
      - name: Narrate
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          MODE: ${{ github.event.inputs.mode }}
          VOICES: ${{ github.event.inputs.voices }}
          STORY: ${{ github.event.inputs.story }}
        run: |
          if [ "$MODE" = "samples" ]; then python3 daily/tools/audio.py samples "$VOICES"
          elif [ "$MODE" = "story" ]; then python3 daily/tools/audio.py story "$STORY"
          else python3 daily/tools/audio.py; fi
      - name: Commit and redeploy
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git config user.name "daily-bot"; git config user.email "daily-bot@users.noreply.github.com"
          for d in daily/branje/audio daily/tts-test; do [ -e "$d" ] && git add -A "$d"; done
          git status --short | head -20
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "audio: narration" && git pull --rebase -q && git push -q
          gh workflow run pages.yml
